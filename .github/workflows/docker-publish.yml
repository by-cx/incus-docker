name: Publish container images

on:
  schedule:
    - cron: "36 10 * * *"
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('incus-pr-{0}', github.event.pull_request.number) || 'incus-publish' }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: by-cx/incus-docker

jobs:
  build:
    name: Build ${{ matrix.tag }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - channel: stable
            tag: latest
          - channel: daily
            tag: daily
          - channel: lts-7.0
            tag: lts

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate scripts
        run: |
          sh -n install.sh bin/incus debian-version/incus-healthcheck
          bash -n debian-version/incus-entrypoint

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./debian-version
          build-args: |
            INCUS_CHANNEL=${{ matrix.channel }}
          cache-from: type=gha,scope=${{ matrix.tag }}
          cache-to: type=gha,mode=max,scope=${{ matrix.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/by-cx/incus-docker
            org.opencontainers.image.description=Incus in a Debian Trixie container
          platforms: linux/amd64,linux/arm64
          provenance: mode=max
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.tag }}
